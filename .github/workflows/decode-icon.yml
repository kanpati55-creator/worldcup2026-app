name: Generate icon
on:
  push:
    branches: ["gh-pages"]
    paths: ["make_icon.py"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Generate icon
        run: python make_icon.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch -q icon.b64 upload-test.png || true
          git add apple-touch-icon.png
          git diff --cached --quiet || git commit -m "Generate apple-touch-icon.png"
          git push
