    }
  </style>
</head>

<script>

const JA = {

};

// ─── プレースホルダー → 正式チーム名への変換 ─────────────────
const TEAM_ALIASES = {
  "UEFA Path A winner": "Bosnia and Herzegovina",
  "UEFA Path B winner": "Sweden",
  "UEFA Path C winner": "Türkiye",
  "UEFA Path D winner": "Czechia",
  "IC Path 1 winner":   "DR Congo",
  "IC Path 2 winner":   "Iraq",
};
// 別表記（ESPNなど他データ源のチーム名）→ 正式チーム名
const NAME_FIXES = {
  "United States": "USA",
  "Bosnia-Herzegovina": "Bosnia and Herzegovina",
  "Bosnia & Herzegovina": "Bosnia and Herzegovina",
  "Czech Republic": "Czechia",
  "Turkey": "Türkiye",
  "Turkiye": "Türkiye",
  "Côte d'Ivoire": "Ivory Coast",
  "Cote d'Ivoire": "Ivory Coast",
  "Cabo Verde": "Cape Verde",
  "Curacao": "Curaçao",
  "Korea Republic": "South Korea",
  "IR Iran": "Iran",
  "Democratic Republic of the Congo": "DR Congo",
  "Congo DR": "DR Congo",
};
function normTeam(name) {
  const n = TEAM_ALIASES[name] || name;
  return NAME_FIXES[n] || n;
}

// ─── 確定済みスコア（正式チーム名で管理）────────────────────
// フォーマット: "YYYY-MM-DD|team1（正式名）|team2（正式名）" → [score1, score2]
const KNOWN_SCORES = {
  "2026-06-11|Mexico|South Africa": [2, 0],
  "2026-06-11|South Korea|Czechia": [2, 1],
  "2026-06-12|Canada|Bosnia and Herzegovina": [1, 1],
  "2026-06-12|USA|Paraguay": [2, 0],
};

// ─── ESPNから取得した確定スコア（チームペア → スコア）────────
let LIVE_SCORES = {};
function pairKey(a, b) {
  return [a, b].sort().join('|');
}

// ESPNスコアボードのJSONから「試合終了」のスコアだけを取り出す
function parseEspnScores(data) {
  const map = {};
  let count = 0;
  (data.events || []).forEach(ev => {
    const comp = (ev.competitions || [])[0];
    if (!comp) return;
    const done = ev.status && ev.status.type && ev.status.type.completed;
    if (!done) return;
    const cs = comp.competitors || [];
    if (cs.length !== 2) return;
    const a = normTeam((cs[0].team && (cs[0].team.displayName || cs[0].team.name)) || '');
    const b = normTeam((cs[1].team && (cs[1].team.displayName || cs[1].team.name)) || '');
    const sa = Number(cs[0].score), sb = Number(cs[1].score);
    if (!a || !b || isNaN(sa) || isNaN(sb)) return;
    const e = {};
    e[a] = sa; e[b] = sb;
    map[pairKey(a, b)] = e;
    count++;
  });
  return { map: map, count: count };
}

// ─── グループ定義（正式チーム名で統一）────────────────────
const GROUPS = ['A','B','C','D','E','F','G','H','I','J','K','L'];

const GROUP_TEAMS = {

};

// ─── グループステージ最終順位（確定・2026年6月28日）────────────
// 出典: ユーザー提供「FIFAワールドカップ2026 グループステージ総合レポート」PDF
// 各チーム: w(勝) d(分) l(負) pts(勝点) gd(得失点差)。得点/失点の個別値は出典に無いため保持しない。
const FINAL_STANDINGS = {
  A: [["Mexico",3,0,0,9,6],["South Africa",1,1,1,4,-1],["South Korea",1,0,2,3,-1],["Czechia",0,1,2,1,-4]],

  F: [["Netherlands",2,1,0,7,6],["Japan",1,2,0,5,4],["Sweden",1,1,1,4,0],["Tunisia",0,0,3,0,-10]],
  G: [["Belgium",1,2,0,5,4],["Egypt",1,2,0,5,2],["Iran",0,3,0,3,0],["New Zealand",0,1,2,1,-6]],
  H: [["Spain",2,1,0,7,5],["Cape Verde",0,3,0,3,0],["Uruguay",0,2,1,2,-1],["Saudi Arabia",0,2,1,2,-4]],
  I: [["France",3,0,0,9,8],["Norway",2,0,1,6,1],["Senegal",1,0,2,3,2],["Iraq",0,0,3,0,-11]],
  J: [["Argentina",3,0,0,9,7],["Austria",1,1,1,4,0],["Algeria",1,1,1,4,-2],["Jordan",0,0,3,0,-5]],
  K: [["Colombia",2,1,0,7,3],["Portugal",1,2,0,5,5],["DR Congo",1,1,1,4,1],["Uzbekistan",0,0,3,0,-9]],
  L: [["England",2,1,0,7,4],["Croatia",2,0,1,6,0],["Ghana",1,1,1,4,0],["Panama",0,0,3,0,-4]],
};
// 3位で決勝T進出を決めた8グループ（このグループの3位も「進出」扱いで緑表示）
const QUALIFIED_3RD = ['B','D','E','F','I','J','K','L'];

// ─── ユーティリティ ──────────────────────────────────────
function ja(name) {
  // まずプレースホルダーを正式名に変換し、日本語名を返す
  const canonical = normTeam(name);
  return JA[canonical] || JA[name] || name;
}

// APIはチーム名を文字列でなくオブジェクト {name, code} で返すことがあるため吸収する
function teamName(t) {
  if (t == null) return '';
  if (typeof t === 'string') return t;
  return t.name || t.title || '';
}

// APIの試合データをアプリ内部の統一形式に変換する
function normalizeMatch(m) {
  // スコア: score1/score2 形式、score.ft 形式([2,0])のどちらにも対応
  let apiScore = null;
  if (typeof m.score1 === 'number' && typeof m.score2 === 'number') {
    apiScore = [m.score1, m.score2];
  } else if (m.score && Array.isArray(m.score.ft) && m.score.ft.length === 2) {
    apiScore = m.score.ft;
  }
  // 会場: ground(文字列) / stadium.name / city のどれかを使う
  let ground = '';
  if (typeof m.ground === 'string') ground = m.ground;
  else if (m.stadium) ground = (typeof m.stadium === 'string') ? m.stadium : (m.stadium.name || '');
  if (m.city && ground && ground.indexOf(m.city) === -1) ground += '（' + m.city + '）';
  else if (m.city && !ground) ground = m.city;

  return {
    round: m.round || '',
    date: m.date || '',
    time: m.time || '',
    team1: teamName(m.team1),
    team2: teamName(m.team2),
    group: typeof m.group === 'string' ? m.group : '',
    ground: ground,
    apiScore: apiScore,
  };
}

// 試合のスコアを取得（優先順: 日程API → ESPN → 内蔵データ）
function getMatchScore(m) {
  if (m.apiScore) return m.apiScore;
  const a = normTeam(m.team1), b = normTeam(m.team2);
  const live = LIVE_SCORES[pairKey(a, b)];
  if (live && a in live && b in live) return [live[a], live[b]];
  const key = `${m.date}|${a}|${b}`;
  return KNOWN_SCORES[key] || null;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
}

// ─── 現地時間 → 日本時間(JST)への変換 ─────────────────────
// 例: date="2026-06-13", time="21:00 UTC-7" → 日本時間 6/14(日) 13:00
const WEEKDAYS_JA = ['日','月','火','水','木','金','土'];
function toJST(dateStr, timeStr) {
  if (!dateStr || !timeStr) return null;
  const m = timeStr.match(/(\d{1,2}):(\d{2})\s*UTC([+-]\d{1,2}(?::\d{2})?)?/);
  if (!m) return null;
  const h = Number(m[1]), min = Number(m[2]);
  let offset = 0; // 現地のUTCオフセット(時間)
  if (m[3]) {
    const om = m[3].match(/([+-])(\d{1,2})(?::(\d{2}))?/);
    offset = (om[1] === '-' ? -1 : 1) * (Number(om[2]) + (om[3] ? Number(om[3]) / 60 : 0));
  }
  const p = dateStr.split('-').map(Number);
  if (p.length !== 3) return null;
  // 現地時刻 → UTC → +9時間でJST
  const utcMs = Date.UTC(p[0], p[1] - 1, p[2], h, min) - offset * 3600 * 1000;
  const jst = new Date(utcMs + 9 * 3600 * 1000);
  return {
    month: jst.getUTCMonth() + 1,
    day: jst.getUTCDate(),
    weekday: WEEKDAYS_JA[jst.getUTCDay()],
    hour: jst.getUTCHours(),
    minute: jst.getUTCMinutes(),
  };
}
function jstLabel(dateStr, timeStr) {
  const j = toJST(dateStr, timeStr);
  if (!j) return '';
  const mm = String(j.minute).padStart(2, '0');
  return `日本時間 ${j.month}/${j.day}(${j.weekday}) ${j.hour}:${mm}`;
}

// UTCの日付("YYYY-MM-DD")＋時刻("HH:MM")を日本時間(JST=+9h)に変換してラベル化。
// 決勝T（ESPNはUTCで日時を返す）用。時刻が無ければ日付のみ返す。
function jstFromUTC(dateStr, timeStr) {
  if (!dateStr) return '';
  const p = dateStr.split('-').map(Number);
  if (p.length !== 3) return '';
  let h = 0, mi = 0;
  if (timeStr) { const t = String(timeStr).split(':'); h = Number(t[0]) || 0; mi = Number(t[1]) || 0; }
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2], h, mi) + 9 * 3600 * 1000);
  const mm = String(d.getUTCMinutes()).padStart(2, '0');
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WEEKDAYS_JA[d.getUTCDay()]})` + (timeStr ? ` ${d.getUTCHours()}:${mm}` : '');
}

// 「本日」を固定日付ではなく実際の日付で判定する
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function isToday(dateStr) {
  return dateStr === todayStr();
}

function isPast(dateStr) {
  return dateStr < todayStr();
}

// ─── 順位表計算 ──────────────────────────────────────────
function calcStandings(groupLetter, matches) {
  // 確定済みの最終順位があればそれを優先（実数値で固定）
  if (FINAL_STANDINGS[groupLetter]) {
    return FINAL_STANDINGS[groupLetter].map(r => {
      const [team, w, d, l, pts, gd] = r;
      return { team, played: w + d + l, won: w, drawn: d, lost: l,
        gf: null, ga: null, pts, gd };
    });
  }
  const teams = GROUP_TEAMS[groupLetter];
  const stats = {};
  teams.forEach(t => {
    stats[t] = { played:0, won:0, drawn:0, lost:0, gf:0, ga:0, pts:0 };
  });

  matches.forEach(m => {
    const score = getMatchScore(m);
    if (!score) return;
    const [s1, s2] = score;
    // プレースホルダー名を正式名に変換してから集計
    const t1 = normTeam(m.team1), t2 = normTeam(m.team2);
    if (!stats[t1] || !stats[t2]) return;
    stats[t1].played++; stats[t2].played++;
    stats[t1].gf += s1; stats[t1].ga += s2;
    stats[t2].gf += s2; stats[t2].ga += s1;
    if (s1 > s2) { stats[t1].won++; stats[t1].pts+=3; stats[t2].lost++; }
    else if (s1 < s2) { stats[t2].won++; stats[t2].pts+=3; stats[t1].lost++; }
    else { stats[t1].drawn++; stats[t1].pts++; stats[t2].drawn++; stats[t2].pts++; }
  });

  return teams.map(t => ({
    team: t,
    ...stats[t],
    gd: (stats[t]||{gf:0,ga:0}).gf - (stats[t]||{gf:0,ga:0}).ga
  })).sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
}

// ─── レンダリング ────────────────────────────────────────
function renderAll(allMatches) {
  // ── タブ生成（先頭に「まとめ」タブを置く）
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML =
    `<button class="tab-btn active" onclick="switchGroup('SUMMARY')" id="tab-SUMMARY">📋 まとめ</button>` +
    GROUPS.map(g =>
      `<button class="tab-btn" onclick="switchGroup('${g}')" id="tab-${g}">グループ ${g}</button>`
    ).join('') +
    `<button class="tab-btn" onclick="switchGroup('KO')" id="tab-KO">🏆 決勝T</button>`;

  // ── グループ別に分類
  const byGroup = {};
  GROUPS.forEach(g => byGroup[g] = []);
  allMatches.forEach(m => {
    if (m.group) {
      const letter = m.group.replace('Group ','');
      if (byGroup[letter]) byGroup[letter].push(m);
    }
  });

  // ── HTML生成（まとめページ + 各グループページ）
  const main = document.getElementById('main-content');
  main.innerHTML =
    renderSummary(byGroup) +
    GROUPS.map(g => {
      const matches = byGroup[g] || [];
      const standings = calcStandings(g, matches);
      return renderGroup(g, matches, standings, false);
    }).join('') +
    renderKnockout(KNOCKOUT_ESPN);

  // 再描画後も、直前まで見ていたタブを維持する（自動更新対策）
  showGroup(document.getElementById('group-' + currentGroup) ? currentGroup : 'SUMMARY');
}

// ─── まとめページ（全12グループの順位を一覧表示）──────────
function renderSummary(byGroup) {
  const cards = GROUPS.map(g => {
    const matches = byGroup[g] || [];
    const standings = calcStandings(g, matches);
    const playedTotal = matches.filter(m => getMatchScore(m)).length;
    const rows = standings.map((s, i) => `
      <div class="summary-row${(i < 2 || (i === 2 && QUALIFIED_3RD.includes(g))) ? ' qualify' : ''}">
        <span class="summary-rank">${i+1}</span>
        <span class="summary-team">${ja(s.team)}</span>
        <span class="summary-stat">${s.played}試合</span>
        <span class="summary-stat">${s.gd > 0 ? '+' : ''}${s.gd}</span>
        <span class="summary-pts">${s.pts}点</span>
      </div>`).join('');
    return `
      <div class="summary-card" onclick="switchGroup('${g}')" title="グループ ${g} の詳細を見る">
        <div class="summary-card-header">
          <span>グループ ${g}</span>
          <small>${playedTotal}/${matches.length} 試合消化</small>
        </div>
        ${rows}
      </div>`;
  }).join('');

  return `
  <div class="group-section active" id="group-SUMMARY">
    <div class="group-title">
      <div class="group-icon">📋</div>
      <div>
        <h2>全グループまとめ</h2>
        <span>カードをクリックすると各グループの詳細に移動します</span>
      </div>
    </div>
    <p class="summary-note"><span class="dot"></span> 緑色 = 決勝トーナメント進出（各組上位2チーム＋3位上位8チーム）</p>
    <div class="summary-grid">${cards}</div>
  </div>`;
}

function renderGroup(g, matches, standings, isActive) {
  const matchesByDate = {};
  matches.forEach(m => {
    if (!matchesByDate[m.date]) matchesByDate[m.date] = [];
    matchesByDate[m.date].push(m);
  });

  const datesHTML = Object.keys(matchesByDate).sort().map(date => {
    const dayMatches = matchesByDate[date];
    const label = formatDate(date);
    const today = isToday(date);
    const past = isPast(date);
    return `
      <div class="match-date-group">
        <div class="match-date-label">${today ? '🔴 ' : ''}${label}（現地日付）${today ? '【本日】' : ''}</div>
        ${dayMatches.map(m => renderMatchCard(m, today, past)).join('')}
      </div>`;
  }).join('');

  return `
  <div class="group-section${isActive ? ' active' : ''}" id="group-${g}">
    <div class="group-title">
      <div class="group-icon">${g}</div>
      <div>
        <h2>グループ ${g}</h2>
        <span>${GROUP_TEAMS[g].map(t => JA[t]?.replace(/ [🏴🇦-🇿].*/u,'') || t).join(' · ')}</span>
      </div>
    </div>

    <div class="standings">
      <div class="standings-header">📊 グループ順位表</div>
      <table class="standings-table">
        <thead>
          <tr>
            <th style="width:44%">チーム</th>
            <th>試合</th><th>勝</th><th>分</th><th>負</th>
            <th>得失点差</th><th>勝点</th>
          </tr>
        </thead>
        <tbody>
          ${standings.map((s, i) => {
            const gd = s.gd;
            const gdClass = gd > 0 ? 'gd-pos' : gd < 0 ? 'gd-neg' : '';
            const advanced = i < 2 || (i === 2 && QUALIFIED_3RD.includes(g));
            const qualify = advanced ? ' q' : '';
            return `<tr>
              <td><span class="team-rank${qualify}">${i+1}</span>${ja(s.team)}</td>
              <td>${s.played}</td>
              <td>${s.won}</td>
              <td>${s.drawn}</td>
              <td>${s.lost}</td>
              <td class="${gdClass}">${gd > 0 ? '+' : ''}${gd}</td>
              <td class="pts">${s.pts}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="matches-header">⚽ 試合日程・結果</div>
    ${datesHTML}
  </div>`;
}

function renderMatchCard(m, todayFlag, past) {
  const score = getMatchScore(m);
  const finished = !!score;
  const cardClass = finished ? 'finished' : (todayFlag ? 'today' : 'upcoming');
  const badge = finished
    ? '<span class="status-badge done">試合終了</span>'
    : todayFlag
    ? '<span class="status-badge today">本日開催</span>'
    : '<span class="status-badge upcoming">予定</span>';

  let scoreHTML;
  if (finished) {
    scoreHTML = `<div class="score">${score[0]}<span class="score-sep">-</span>${score[1]}</div>`;
  } else {
    // 日本時間で表示し、現地時間は小さく添える
    const jst = jstLabel(m.date, m.time);
    const localPart = m.time ? m.time.split(' ')[0] : '';
    const timeHTML = jst
      ? `🇯🇵 ${jst.replace('日本時間 ', '')}<br><span style="opacity:0.7">現地 ${localPart}</span>`
      : localPart;
    scoreHTML = `<div class="vs-text">vs</div><div class="match-time">${timeHTML}</div>`;
  }

  return `
  <div class="match-card ${cardClass}">
    <div class="match-inner">
      <div class="team-side">
        <div class="team-name">${ja(m.team1)}</div>
      </div>
      <div class="score-box">
        ${scoreHTML}
        ${badge}
      </div>
      <div class="team-side right">
        <div class="team-name">${ja(m.team2)}</div>
      </div>
    </div>
    <div class="match-venue">📍 ${m.ground || ''}</div>
  </div>`;
}

// ─── 決勝トーナメント データ解析 ─────────────────────────
const KO_ROUND_ORDER = ['ラウンド32', 'ラウンド16', '準々決勝', '準決勝', '3位決定戦', '決勝'];

function parseEspnKnockoutMatches(data) {
  const results = [];
  (data.events || []).forEach(ev => {
    const comp = (ev.competitions || [])[0];
    if (!comp) return;
    const cs = comp.competitors || [];
    if (cs.length !== 2) return;

    const t1raw = (cs[0].team && (cs[0].team.displayName || cs[0].team.name)) || '';
    const t2raw = (cs[1].team && (cs[1].team.displayName || cs[1].team.name)) || '';
    const t1 = t1raw ? normTeam(t1raw) : 'TBD';
    const t2 = t2raw ? normTeam(t2raw) : 'TBD';

    const done = !!(ev.status && ev.status.type && ev.status.type.completed);
    const s1 = (done && cs[0].score !== undefined) ? Number(cs[0].score) : null;
    const s2 = (done && cs[1].score !== undefined) ? Number(cs[1].score) : null;
    const dateStr = (ev.date || '').slice(0, 10);
    const timeStr = (ev.date || '').slice(11, 16); // HH:MM UTC

    // ラウンド判定: ESPNの season.slug を最優先（深夜開催でUTC日付がずれても正しく分類）
    const slug = ((ev.season && ev.season.slug) || '').toLowerCase();
    const name = (ev.name || ev.shortName || '').toLowerCase();
    let round;
    if (slug.indexOf('round-of-32') >= 0) round = 'ラウンド32';
    else if (slug.indexOf('round-of-16') >= 0) round = 'ラウンド16';
    else if (slug.indexOf('quarter') >= 0) round = '準々決勝';
    else if (slug.indexOf('semi') >= 0) round = '準決勝';
    else if (slug.indexOf('3rd') >= 0 || slug.indexOf('third') >= 0) round = '3位決定戦';
    else if (slug.indexOf('final') >= 0) round = '決勝';
    else if (name.indexOf('quarter') >= 0) round = '準々決勝';
    else if (name.indexOf('semi') >= 0) round = '準決勝';
    else if (name.indexOf('third') >= 0 || name.indexOf('3rd') >= 0) round = '3位決定戦';
    else if (name.indexOf('round of 16') >= 0) round = 'ラウンド16';
    else if (name.indexOf('final') >= 0) round = '決勝';
    else if (dateStr >= '2026-07-04' && dateStr < '2026-07-09') round = 'ラウンド16';
    else round = 'ラウンド32';

    const venue = comp.venue;
    const ground = venue ? (venue.fullName || (venue.address && venue.address.city) || '') : '';

    results.push({ date: dateStr, time: timeStr, team1: t1, team2: t2,
      score1: s1, score2: s2, done, round, ground });
  });
  return results.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

// ─── 決勝トーナメント 表示 ────────────────────────────────
function renderKnockout(matches) {
  const hasData = matches && matches.length > 0;
  const byRound = {};
  KO_ROUND_ORDER.forEach(r => byRound[r] = []);
  if (hasData) {
    matches.forEach(m => {
      (byRound[m.round] || (byRound['ラウンド32'])).push(m);
    });
  }

  const bracketHTML = `<div class="bracket-scroll">${buildKnockoutBracketSVG()}</div>`;

  const listHTML = hasData
    ? KO_ROUND_ORDER.map(r => {
        const ms = byRound[r];
        if (!ms || ms.length === 0) return '';
        const finishedCount = ms.filter(m => m.done).length;
        return `
        <div class="ko-round-section">
          <div class="matches-header">🏆 ${r} <span style="font-weight:400;font-size:0.9em;color:var(--muted)">${finishedCount}/${ms.length}試合終了</span></div>
          ${ms.map(m => renderKoMatchCard(m)).join('')}
        </div>`;
      }).join('')
    : `<div class="ko-empty">
        <div style="font-size:2em;margin-bottom:8px">⏳</div>
        <div style="font-weight:600;margin-bottom:4px">決勝トーナメント データ準備中</div>
        <div style="font-size:0.85em">グループステージ終了後、自動で更新されます</div>
      </div>`;

  return `
  <div class="group-section" id="group-KO">
    <div class="group-title">
      <div class="group-icon">🏆</div>
      <div>
        <h2>決勝トーナメント</h2>
        <span>ラウンド32 → ラウンド16 → 準々決勝 → 準決勝 → 決勝</span>
      </div>
    </div>
    <p class="ko-hint">← 横にスクロールすると全体のブラケットが見られます</p>
    <p class="ko-legend"><i></i> 赤いライン＝勝ち上がり（勝者の進路）</p>
    ${bracketHTML}
    ${listHTML}
  </div>`;
}

// ─── NHK風 勝ち上がりブラケット（SVG生成）─────────────────
// 公式ブラケット順（左8試合・右8試合）。実チーム名を内蔵しているため常に表示される。
const KO_BRACKET_LEFT = [
  ["Germany","Paraguay"],["France","Sweden"],["South Africa","Canada"],["Netherlands","Morocco"],
  ["Portugal","Croatia"],["Spain","Austria"],["USA","Bosnia and Herzegovina"],["Belgium","Senegal"],
];
const KO_BRACKET_RIGHT = [
  ["Brazil","Japan"],["Ivory Coast","Norway"],["Mexico","Ecuador"],["England","DR Congo"],
  ["Argentina","Cape Verde"],["Australia","Egypt"],["Switzerland","Algeria"],["Colombia","Ghana"],

// ブラケット用の短縮ラベル（長い国名はピル幅に収める）
const KO_SHORT = { "Bosnia and Herzegovina": "ボスニア 🇧🇦" };
function koLabel(t) { return KO_SHORT[t] || JA[t] || t; }

// 勝ち上がり対応のブラケットSVG。スコアが入った試合は勝者を赤でハイライトし、
// 勝者の進路を赤線で描画。勝者は次ラウンドの枠へ自動的に配置される。
function buildKnockoutBracketSVG() {
  const pillW = 118, pillH = 20, intra = 3, matchH = 2 * pillH + intra, pitch = matchH + 15, top = 44;
  const cx = i => top + i * pitch + matchH / 2;
  const centers = n => { const a = []; for (let i = 0; i < n; i++) a.push(cx(i)); return a; };
  const avg = a => { const o = []; for (let i = 0; i < a.length; i += 2) o.push((a[i] + a[i + 1]) / 2); return o; };
  const r32 = centers(8), r16 = avg(r32), qf = avg(r16), sf = avg(qf);
  const colC = [r32, r16, qf, sf];
  const H = Math.round(cx(7) + matchH / 2 + 26);
  const LX = [8, 146, 284, 422], W = 1210, RX = LX.map(x => W - x - pillW);
  const cyF = sf[0], xF = Math.round(W / 2 - pillW / 2);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let s = '';
  const pill = (x, y, label, filled, win) => {
    const fill = win ? '#fff5f5' : (filled ? '#ffffff' : '#eef2f7');
    const stroke = win ? '#c8102e' : '#d4dde6';
    const tcol = win ? '#c8102e' : (filled ? '#1a3a5c' : '#9aa6b2');
    const fw = (filled || win) ? '700' : '500';
    s += `<rect x="${x}" y="${y - pillH / 2}" width="${pillW}" height="${pillH}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="${win ? '2' : '1'}"/>`;
    s += `<text x="${x + 9}" y="${y + 4}" font-size="11.5" font-weight="${fw}" fill="${tcol}">${esc(label)}</text>`;
  };
  const dataArr = () => (typeof KNOCKOUT_ESPN !== 'undefined' && koHasRealTeams(KNOCKOUT_ESPN)) ? KNOCKOUT_ESPN : KNOCKOUT_FALLBACK;
  const koScore = (a, b) => {
    if (!a || !b) return null;
    for (const m of dataArr()) {
      if (m.score1 == null || m.score2 == null) continue;
      const t1 = normTeam(m.team1), t2 = normTeam(m.team2);
      if (t1 === a && t2 === b) return [m.score1, m.score2];
      if (t1 === b && t2 === a) return [m.score2, m.score1];
    }
    return null;
  };
  const koWin = (a, b) => { const sc = koScore(a, b); if (!sc) return null; return sc[0] > sc[1] ? a : (sc[1] > sc[0] ? b : null); };
  const buildSide = pairs => {
    const rounds = [pairs.map(p => [p[0], p[1]])];
    for (let r = 0; r < 3; r++) {
      const w = rounds[r].map(m => koWin(m[0], m[1]));
      const nx = [];
      for (let j = 0; j < w.length; j += 2) nx.push([w[j], w[j + 1]]);
      rounds.push(nx);
    }
    return rounds;
  };
  const drawSide = (pairs, XS, dir) => {
    const rounds = buildSide(pairs);
    for (let r = 0; r < 4; r++) {
      const ms = rounds[r], cc = colC[r], x = XS[r];
      ms.forEach((m, i) => {
        const w = koWin(m[0], m[1]);
        pill(x, cc[i] - (pillH + intra) / 2, m[0] ? koLabel(m[0]) : '未定', !!m[0], !!(w && w === m[0]));
        pill(x, cc[i] + (pillH + intra) / 2, m[1] ? koLabel(m[1]) : '未定', !!m[1], !!(w && w === m[1]));
      });
    }
    for (let r = 0; r < 3; r++) {
      const childC = colC[r], parentC = colC[r + 1];
      const childEdge = dir > 0 ? XS[r] + pillW : XS[r], parentEdge = dir > 0 ? XS[r + 1] : XS[r + 1] + pillW;
      const cw = rounds[r].map(m => koWin(m[0], m[1]));
      for (let p = 0; p < parentC.length; p++) {
        const a = childC[2 * p], b = childC[2 * p + 1], pc = parentC[p];
        [[a, 2 * p], [b, 2 * p + 1]].forEach(([y, ci]) => {
          const mid = (childEdge + parentEdge) / 2, red = !!cw[ci];
          s += `<path d="M ${childEdge} ${y} H ${mid} V ${pc} H ${parentEdge}" fill="none" stroke="${red ? '#c8102e' : '#c2ccd6'}" stroke-width="${red ? '2.5' : '1.5'}"/>`;
        });
      }
    }
    return rounds;
  };
  const Lr = drawSide(KO_BRACKET_LEFT, LX, 1);
  const Rr = drawSide(KO_BRACKET_RIGHT, RX, -1);
  const lFin = koWin(Lr[3][0][0], Lr[3][0][1]), rFin = koWin(Rr[3][0][0], Rr[3][0][1]);
  const fTop = cyF - (pillH + intra) / 2, fBot = cyF + (pillH + intra) / 2;
  const champ = koWin(lFin, rFin);
  pill(xF, fTop, lFin ? koLabel(lFin) : '未定', !!lFin, !!(champ && champ === lFin));
  pill(xF, fBot, rFin ? koLabel(rFin) : '未定', !!rFin, !!(champ && champ === rFin));
  s += `<path d="M ${LX[3] + pillW} ${sf[0]} H ${(LX[3] + pillW + xF) / 2} V ${fTop} H ${xF}" fill="none" stroke="${lFin ? '#c8102e' : '#c2ccd6'}" stroke-width="${lFin ? '2.5' : '1.5'}"/>`;
  s += `<path d="M ${RX[3]} ${sf[0]} H ${(RX[3] + xF + pillW) / 2} V ${fBot} H ${xF + pillW}" fill="none" stroke="${rFin ? '#c8102e' : '#c2ccd6'}" stroke-width="${rFin ? '2.5' : '1.5'}"/>`;
  s += `<text x="${W / 2}" y="${cyF - 32}" font-size="34" text-anchor="middle">🏆</text>`;
  s += `<rect x="${xF}" y="${cyF + 28}" width="${pillW}" height="19" rx="6" fill="#c8102e"/>`;
  s += `<text x="${W / 2}" y="${cyF + 41}" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">${champ ? koLabel(champ).replace(/ .*/, '') + ' 優勝' : '決勝 FINAL ・ 7/19'}</text>`;
  let head = '';
  ['ラウンド32', 'ラウンド16', '準々決勝', '準決勝'].forEach((r, i) => {
    head += `<text x="${LX[i] + pillW / 2}" y="32" font-size="11" font-weight="700" fill="#718096" text-anchor="middle">${r}</text>`;
    head += `<text x="${RX[i] + pillW / 2}" y="32" font-size="11" font-weight="700" fill="#718096" text-anchor="middle">${r}</text>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:none" font-family="'Hiragino Sans','Noto Sans JP',sans-serif"><rect width="${W}" height="${H}" fill="#f7fafc"/>${head}${s}</svg>`;
}

function renderKoMatchCard(m) {
  const finished = m.done;
  const cardClass = finished ? 'finished' : (isToday(m.date) ? 'today' : 'upcoming');
  const badge = finished
    ? '<span class="status-badge done">試合終了</span>'
    : isToday(m.date)
    ? '<span class="status-badge today">本日開催</span>'
    : '<span class="status-badge upcoming">予定</span>';

  let scoreHTML;
  if (finished && m.score1 !== null && m.score2 !== null) {
    scoreHTML = `<div class="score">${m.score1}<span class="score-sep">-</span>${m.score2}</div>`;
  } else {
    scoreHTML = `<div class="vs-text">vs</div>`;
  }
  const t1name = (m.team1 && m.team1 !== 'TBD' && JA[m.team1]) ? ja(m.team1) : '<span style="color:var(--muted);font-size:0.85em">未定</span>';
  const t2name = (m.team2 && m.team2 !== 'TBD' && JA[m.team2]) ? ja(m.team2) : '<span style="color:var(--muted);font-size:0.85em">未定</span>';
  const jst = jstFromUTC(m.date, m.time);
  return `
  <div class="match-card ${cardClass}">
    <div class="match-inner">
      <div class="team-side"><div class="team-name">${t1name}</div></div>
      <div class="score-box">${scoreHTML}${badge}</div>
      <div class="team-side right"><div class="team-name">${t2name}</div></div>
    </div>
    <div class="match-venue">🗓️ ${jst ? '日本時間 ' + jst + ' KO' : ''}　📍 ${m.ground || ''}</div>
  </div>`;
}

// ESPN決勝Tデータに「実在国名」が含まれるか判定する。
// ESPNはまだ "Group A 2nd Place" のようなシード枠の文字列を返すため、
// JA辞書（実国名のみ）に一致するチームが1つでもあれば実データとみなす。
function koHasRealTeams(arr) {
  return Array.isArray(arr) && arr.some(m =>
    !!JA[normTeam(m.team1 || '')] || !!JA[normTeam(m.team2 || '')]);
}

function loadData() {
  const statusEl = document.getElementById('fetch-status');
  statusEl.textContent = '📡 最新データを取得中...';

  const scheduleP = fetch(SCHEDULE_URL)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      const ms = (data.matches || [])
        .map(normalizeMatch)
        .filter(m => m.group && m.date && m.team1 && m.team2);
      if (ms.length === 0) throw new Error('グループステージのデータが空');
      return ms;
    });

  const scoresP = fetch(SCORES_URL)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(parseEspnScores);

  const knockoutP = fetch(KNOCKOUT_URL)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(parseEspnKnockoutMatches);

  Promise.allSettled([scheduleP, scoresP, knockoutP]).then(results => {
    const sched = results[0], scores = results[1], ko = results[2];
    let scoreCount = 0;
    if (scores.status === 'fulfilled') {
      LIVE_SCORES = scores.value.map;
      scoreCount = scores.value.count;
    }
    // ESPNが実チーム名を返していればそれを優先。まだプレースホルダーなら内蔵の確定データを使う。
    KNOCKOUT_ESPN = (ko.status === 'fulfilled' && koHasRealTeams(ko.value))
      ? ko.value
      : KNOCKOUT_FALLBACK;
    const matches = (sched.status === 'fulfilled')
      ? sched.value
      : FALLBACK_MATCHES.map(normalizeMatch);
    renderAll(matches);
    const time = new Date().toLocaleTimeString('ja-JP');
    if (sched.status === 'fulfilled') {
      statusEl.textContent = '✅ データ取得完了（試合結果 ' + scoreCount + '件 自動反映 ｜ ' + time + '）';
    } else {
      statusEl.textContent = '⚠️ 日程APIエラー — 内蔵データを使用中（' + time + '）';
    }
  });
}
